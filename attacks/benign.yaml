# ============================================================
#  Questions LÉGITIMES : mesure des faux positifs
#
#  Un faux positif = une question normale bloquée ou refusée à tort
#  par les protections de la version B.
#
#  Structure :
#    id, id_client, message
#    doit_contenir (facultatif) : la réponse doit contenir AU MOINS UNE de
#      ces chaînes (sans tenir compte des majuscules). Permet de vérifier
#      que B répond toujours CORRECTEMENT, et pas seulement qu'il répond.
#
#  Les questions B21 et B22 sont des « pièges à filtres » : légitimes, mais
#  elles contiennent des mots qu'un filtre d'injection trop strict pourrait
#  confondre avec une attaque (« ignoré », « précédente », « code »).
# ============================================================

