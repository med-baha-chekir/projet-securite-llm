# ============================================================
#  Laboratoire « Sécurité d'un LLM : avant / après »
#  Lancement :  docker compose up -d
#
#  Services : ollama (modèle local), app-vulnerable (A), app-secure (B), ui.
# ============================================================

services:

  # --- Modèle local : Ollama (aucune API externe) ---
  ollama:
    image: ollama/ollama:0.40.16           # version figée pour la reproductibilité
    container_name: llm-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama          # le modèle téléchargé est conservé ici
    environment:
      - OLLAMA_KEEP_ALIVE=30m              # garde le modèle chargé en mémoire entre deux requêtes
      - OLLAMA_NUM_PARALLEL=1              # une requête à la fois : latences comparables entre A et B
      - OLLAMA_NO_CLOUD=1                  # interdit les modèles « cloud » d'Ollama : 100 % local
    # AUCUN port ouvert sur ta machine (protection P4). Ollama n'a pas
    # d'authentification : tout programme capable de joindre le port 11434 peut
    # interroger le modèle, le supprimer ou en télécharger un autre, en
    # contournant toutes les protections de la version B. Seuls les services du
    # réseau interne « lab » peuvent donc lui parler.
    # Pour un dépannage, le port peut être rouvert temporairement :
    #   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d ollama
    networks:
      - lab
      - telechargement
    # Utilisation de la carte graphique NVIDIA (RTX 3050 Ti, 4 Go)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Téléchargement automatique du modèle au premier lancement ---
  # S'exécute une fois, puis s'arrête. Si le modèle est déjà présent,
  # « ollama pull » vérifie simplement qu'il est à jour.
  ollama-init:
    image: ollama/ollama:0.40.16
    container_name: llm-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=${MODEL_NAME:-llama3.1:8b}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - GUARD_MODEL=${GUARD_MODEL:-llama-guard3:1b}
    # Télécharge le modèle de conversation, le modèle d'embeddings (RAG), puis le
    # classifieur de sécurité de la version B (Llama Guard).
    # « $$ » : Docker Compose transmet un vrai « $ » au shell du conteneur.
    entrypoint: ["/bin/sh", "-c", "ollama pull $$MODEL_NAME && ollama pull $$EMBED_MODEL && ollama pull $$GUARD_MODEL"]
    networks:
      - lab
    restart: "no"

  # --- Génération automatique du canary au premier lancement ---
  # Écrit secrets/canary.txt s'il n'existe pas encore, puis s'arrête.
  # Un canary existant n'est jamais remplacé.
  init-canary:
    build: .
    image: labo-llm-app
    container_name: llm-init-canary
    command: ["python", "evaluation/init_canary.py"]
    user: root                             # seule exception : doit pouvoir créer secrets/ sur la machine
    volumes:
      - ./secrets:/projet/secrets
    network_mode: none                     # aucun réseau : il n'en a pas besoin
    restart: "no"

  # --- Version A : chatbot VOLONTAIREMENT vulnérable ---
  app-vulnerable:
    build: .
    image: labo-llm-app
    container_name: llm-app-vulnerable
    command: ["uvicorn", "app.vulnerable.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env                         # réglages facultatifs (modèle, température, graine)
        required: false
    environment:
      - OLLAMA_URL=http://ollama:11434     # dans le labo, Ollama s'appelle « ollama »
    volumes:
      - ./logs:/projet/logs                # journaux lisibles depuis ta machine
      - ./secrets:/projet/secrets:ro       # canary, en LECTURE SEULE
    networks:
      - lab                                # réseau interne UNIQUEMENT : pas d'Internet
    depends_on:
      ollama-init:
        condition: service_completed_successfully   # attend que les modèles soient téléchargés
      init-canary:
        condition: service_completed_successfully   # attend que le canary existe
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- Version B : chatbot SÉCURISÉ (mêmes modèle, données et outils que A) ---
  app-secure:
    build: .
    image: labo-llm-app
    container_name: llm-app-secure
    command: ["uvicorn", "app.secure.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env                         # mêmes réglages que A (modèle, température, graine)
        required: false
    environment:
      - OLLAMA_URL=http://ollama:11434
      # Interrupteurs des protections (1 = activée, 0 = désactivée).
      # Pour mesurer une protection seule :
      #   PROTECTION_PROMPT_DURCI=0 docker compose up -d app-secure
      - PROTECTION_PROMPT_DURCI=${PROTECTION_PROMPT_DURCI:-1}
      - PROTECTION_TAILLE_MAX=${PROTECTION_TAILLE_MAX:-1}
      - PROTECTION_FILTRE_INJECTION=${PROTECTION_FILTRE_INJECTION:-1}
      - PROTECTION_CLASSIFIEUR=${PROTECTION_CLASSIFIEUR:-1}
      - PROTECTION_DOCUMENTS=${PROTECTION_DOCUMENTS:-1}
      - PROTECTION_OUTILS=${PROTECTION_OUTILS:-1}
      - PROTECTION_CONFIRMATION=${PROTECTION_CONFIRMATION:-1}
      - PROTECTION_DEBIT=${PROTECTION_DEBIT:-1}
      - PROTECTION_TAILLE_REPONSE=${PROTECTION_TAILLE_REPONSE:-1}
      - PROTECTION_MINIMISATION=${PROTECTION_MINIMISATION:-1}
      - PROTECTION_SORTIE_SECRETS=${PROTECTION_SORTIE_SECRETS:-1}
      - PROTECTION_SORTIE_DONNEES=${PROTECTION_SORTIE_DONNEES:-1}
      - PROTECTION_SORTIE_HTML=${PROTECTION_SORTIE_HTML:-1}
      - GUARD_MODEL=${GUARD_MODEL:-llama-guard3:1b}
      - PROTECTION_JOURNAL_MASQUE=${PROTECTION_JOURNAL_MASQUE:-1}
      - SECRET_DANS_PROMPT=${SECRET_DANS_PROMPT:-0}   # réglage d'analyse, voir app/secure/protections.py
    volumes:
      - ./logs:/projet/logs
      - ./secrets:/projet/secrets:ro       # canary en LECTURE SEULE (pas dans le prompt : sert aux filtres)
    networks:
      - lab                                # réseau interne UNIQUEMENT : pas d'Internet
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      init-canary:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- Interface de démonstration (Streamlit) : http://localhost:8501 ---
  ui:
    build: .
    image: labo-llm-app
    container_name: llm-ui
    command: ["streamlit", "run", "app/ui/streamlit_app.py",
              "--server.port=8501", "--server.address=0.0.0.0"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./secrets:/projet/secrets:ro       # le canary sert uniquement à afficher l'alerte de fuite
    environment:
      - URL_APP_A=http://app-vulnerable:8000
      - URL_APP_B=http://app-secure:8000
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false   # pas de statistiques envoyées à Streamlit
      - STREAMLIT_SERVER_HEADLESS=true
      # Adresse fixée : sinon Streamlit interroge un service Internet pour
      # découvrir l'IP publique de la machine (connexion sortante inutile)
      - STREAMLIT_BROWSER_SERVER_ADDRESS=localhost
      - STREAMLIT_CLIENT_TOOLBAR_MODE=minimal         # masque le bouton « Deploy »
    ports:
      - "127.0.0.1:8501:8501"              # accessible UNIQUEMENT depuis ta machine
    networks:
      - lab                                # pour parler aux versions A et B
      - front                              # pour être joignable depuis ton navigateur
    depends_on:
      app-vulnerable:
        condition: service_healthy
    restart: unless-stopped

  # --- Campagne d'attaques : lancée À LA DEMANDE, jamais par « docker compose up » ---
  #   docker compose run --rm campagne --version A
  campagne:
    build: .
    image: labo-llm-app
    profiles: ["outils"]                   # ne démarre pas avec les autres services
    entrypoint: ["python", "evaluation/campagne.py"]
    env_file:
      - path: .env
        required: false
    environment:
      - URL_APP_A=http://app-vulnerable:8000
      - URL_APP_B=http://app-secure:8000
      # Utilisée seulement par evaluation/verifier_labo.py (test du RAG réel) ;
      # la campagne elle-même ne parle jamais directement au modèle.
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./results:/projet/results          # résultats bruts écrits sur ta machine
      - ./attacks:/projet/attacks:ro       # scénarios lus sans reconstruire l'image
      - ./secrets:/projet/secrets:ro       # canary : pour juger les fuites (puis masqué)
    networks:
      - lab                                # seul moyen de joindre A et B
    depends_on:
      app-vulnerable:
        condition: service_healthy

  # --- Analyse des résultats (P6) : tableaux LaTeX et graphiques, À LA DEMANDE ---
  #   docker compose --profile outils run --rm analyse
  # Lit seulement les fichiers de results/ : aucun accès réseau n'est nécessaire.
  analyse:
    build:
      context: .
      dockerfile: Dockerfile.analyse
    image: labo-llm-analyse
    profiles: ["outils"]
    network_mode: none                     # aucun réseau : l'analyse ne parle à personne
    volumes:
      - ./evaluation:/projet/evaluation:ro
      - ./attacks:/projet/attacks:ro       # titres des scénarios
      - ./app:/projet/app:ro               # seulement pour les tests (format des CSV)
      - ./tests:/projet/tests:ro           # pour rejouer tests/test_analyse.py dans l'image
      - ./pytest.ini:/projet/pytest.ini:ro
      - ./results:/projet/results          # lit les CSV bruts, écrit results/figures/

  # --- Vidéo de démonstration (P7), À LA DEMANDE ---
  #   docker compose --profile outils run --rm video python demo/enregistrer.py
  #   docker compose --profile outils run --rm video python demo/monter.py
  # Pilote l'interface comme un utilisateur (navigateur filmé), puis monte la vidéo.
  video:
    build:
      context: .
      dockerfile: Dockerfile.video
    image: labo-llm-video
    profiles: ["outils"]
    ipc: host                              # recommandé pour Chromium
    volumes:
      - ./demo:/projet/demo
      - ./attacks:/projet/attacks:ro       # texte des attaques
      - ./evaluation:/projet/evaluation:ro # critères de succès (même verdict que la campagne)
      - ./data:/projet/data:ro             # clients fictifs (critère A8)
      - ./secrets:/projet/secrets:ro       # canary : pour juger les fuites
      - ./results/figures:/projet/results/figures:ro   # chiffres de l'écran final
    networks:
      - front                              # seul accès : l'interface (http://ui:8501)
    depends_on:
      ui:
        condition: service_started

networks:
  # Réseau INTERNE du labo : aucun accès à Internet.
  # Les applications A et B seront branchées uniquement ici.
  lab:
    internal: true
  # Réseau avec accès Internet, réservé à Ollama pour télécharger
  # le modèle. Les applications n'y seront jamais connectées.
  telechargement:
  # Réseau de l'interface. Docker ne peut pas ouvrir de port vers un réseau
  # « internal » : l'interface a donc besoin de ce réseau pour être joignable.
  # Compromis assumé : seule l'interface (sans secret propre) y est branchée.
  front:

volumes:
  ollama-data:
